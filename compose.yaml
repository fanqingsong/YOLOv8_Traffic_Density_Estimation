services:
  download-data:
    build:
      context: .
      dockerfile: Dockerfile.train
    environment:
      RAW_DATA_DIR: /data/raw
      KAGGLE_DATASET: ${KAGGLE_DATASET:-farzadnekouei/top-view-vehicle-detection-image-dataset}
      KAGGLE_USERNAME: ${KAGGLE_USERNAME:-}
      KAGGLE_KEY: ${KAGGLE_KEY:-}
    volumes:
      - ./data:/data
      - ${KAGGLE_CONFIG_DIR:-./.kaggle}:/root/.kaggle:ro
    command: ["python", "scripts/download_kaggle_dataset.py"]

  prepare-data:
    build:
      context: .
      dockerfile: Dockerfile.train
    environment:
      RAW_DATA_DIR: /data/raw
      DATASET_DIR: /data/dataset
    volumes:
      - ./data:/data
    command: ["python", "scripts/prepare_dataset.py"]

  train:
    build:
      context: .
      dockerfile: Dockerfile.train
    shm_size: "8gb"
    environment:
      DATA_YAML: /data/dataset/data.yaml
      MODEL_OUTPUT: /models/best.pt
      ONNX_OUTPUT: /models/best.onnx
      RUNS_PROJECT: /data/runs/detect
      RUN_NAME: train
      # CPU fallback when GPU is not passed to Docker (see compose.gpu.yaml)
      TRAIN_DEVICE: ${TRAIN_DEVICE:-cpu}
      TRAIN_EPOCHS: ${TRAIN_EPOCHS:-100}
      TRAIN_BATCH: ${TRAIN_BATCH:-32}
      BASE_MODEL: ${BASE_MODEL:-yolov8n.pt}
    volumes:
      - ./data:/data
      - ./models:/models
    command: ["python", "scripts/train_model.py"]

  quantize-model:
    build:
      context: .
      dockerfile: Dockerfile.quantize
    environment:
      QUANT_MODEL_INPUT: /models/best.pt
      DATA_YAML: /data/dataset/data.yaml
      OPENVINO_FP32_OUTPUT: /models/best_fp32_openvino_model
      OPENVINO_INT8_OUTPUT: /models/best_int8_openvino_model
      QUANT_REPORT_OUTPUT: /models/quantization_comparison.json
      QUANT_IMGSZ: ${QUANT_IMGSZ:-640}
      QUANT_BATCH: ${QUANT_BATCH:-1}
      QUANT_DEVICE: ${QUANT_DEVICE:-cpu}
      QUANT_CALIBRATION_FRACTION: ${QUANT_CALIBRATION_FRACTION:-1.0}
    volumes:
      - ./data:/data:ro
      - ./models:/models
    command: ["python", "-m", "scripts.model_quantization"]

  traffic-analysis:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MODEL_PATH: ${MODEL_PATH:-/app/models/best.pt}
      VIDEO_PATH: /app/input/sample_video.mp4
      OUTPUT_PATH: /app/output/processed_sample_video.avi
      DISPLAY_VIDEO: "false"
    volumes:
      - ./models:/app/models:ro
      - ./sample_video.mp4:/app/input/sample_video.mp4:ro
      - ./output:/app/output
